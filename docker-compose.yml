# Local PostgreSQL for development. API and worker run through pnpm on the host.
# Application images and deployment are separate work in M4.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: rikskollen
      POSTGRES_PASSWORD: rikskollen
      POSTGRES_DB: rikskollen
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rikskollen -d rikskollen"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - rikskollen_db_data:/var/lib/postgresql

volumes:
  rikskollen_db_data:
