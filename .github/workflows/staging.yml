name: Staging stack

on:
  pull_request:
  push:
    branches: [main]

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-password
      WEB_PORT: 4080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test the isolated staging stack
        shell: bash
        run: |
          set -euo pipefail
          export GIT_SHA=$(git rev-parse HEAD)
          export IMAGE_TAG=$GIT_SHA
          dc() { docker compose -p rikskollen-ci -f compose.staging.yml "$@"; }
          trap 'dc logs --no-color; dc down -v' EXIT
          dc config --quiet
          dc build api web worker migrate
          dc up -d --wait db
          # The API must stay unready until the schema is migrated.
          dc up -d api
          dc exec -T api node --input-type=module -e "for(let n=0;n<20;n++){try{const r=await fetch('http://127.0.0.1:3000/ready'); process.exit(r.status===503?0:1)}catch{await new Promise(r=>setTimeout(r,500))}} process.exit(1)"
          dc run --rm migrate
          # Reapplying the same migration history must be safe.
          dc run --rm migrate
          dc up -d --wait api web
          dc run --rm worker --version
          # Validate the packaged scheduler without performing source requests.
          dc run --rm worker dist/scheduler.js --check
          # Config validation performs no checks or notifications.
          dc run --rm worker dist/monitor.js --check
          # The empty migrated fixture intentionally has missing jobs/coverage.
          # Verify the opt-in container can persist state as the Node user.
          set +e
          dc --profile monitoring run --rm --no-deps monitor dist/monitor.js --once
          monitor_exit=$?
          set -e
          test "$monitor_exit" -eq 1
          dc --profile monitoring run --rm --no-deps monitor -e "const fs=require('node:fs'); const s=JSON.parse(fs.readFileSync('/app/monitor-state/state.json','utf8')); if(s.active.length!==8 || s.pending) process.exit(1)"
          # Restore known source/provenance and operational rows into a separate
          # container/volume with no network. No live upstream requests.
          dc exec -T db psql -U rikskollen -d rikskollen -v ON_ERROR_STOP=1 < scripts/fixtures/recovery-seed.sql
          mkdir -p backups
          bash scripts/backup-db.sh backups/ci -p rikskollen-ci -f compose.staging.yml
          bash scripts/verify-restore.sh backups/ci scripts/fixtures/recovery-assert.sql
          # A failure after restore must also release the disposable resources.
          if bash scripts/verify-restore.sh backups/ci scripts/fixtures/recovery-fail.sql; then
            echo 'Expected restore assertion failure' >&2; exit 1
          fi
          test -z "$(docker ps -aq --filter name=rikskollen-restore-)"
          test -z "$(docker volume ls -q --filter name=rikskollen-restore-)"
          cp -r backups/ci backups/corrupt
          printf 'corruption' >> backups/corrupt/database.dump
          if bash scripts/verify-restore.sh backups/corrupt; then
            echo 'Expected checksum rejection' >&2; exit 1
          fi
          # Return the smoke database to its empty migrated state.
          dc exec -T db psql -U rikskollen -d rikskollen -v ON_ERROR_STOP=1 -c 'TRUNCATE import_attempts, vote_import_runs CASCADE'
          node scripts/smoke-deployment.mjs --empty
          dc restart api web
          dc up -d --wait api web
          node scripts/smoke-deployment.mjs --empty
          dc stop api
          node --input-type=module -e "const r = await fetch('http://127.0.0.1:4080/health'); if(r.status !== 503) process.exit(1); const p = await fetch('http://127.0.0.1:4080/api/votes'); if(p.status !== 502) process.exit(1)"
          dc up -d --wait api web
          node scripts/smoke-deployment.mjs --empty
